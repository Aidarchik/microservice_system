<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Users</title>
</head>
<body>

<h1>User List</h1>

<a href="/admin/create">+ Create new User</a>

<hr>

<table Border="1" cellpadding="10">
    <thead>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>LastName</th>
        <th>Email</th>
        <th>Password</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="u : ${users}">
        <td th:text="${u.id}"></td>
        <td th:text="${u.firstName}"></td>
        <td th:text="${u.lastName}"></td>
        <td th:text="${u.email}"></td>
        <td th:text="${u.password}"></td>
        <td>
            <a th:href="@{|/admin/${u.id}|}">View</a>
            |
            <a th:href="@{|/admin/${u.id}/edit|}">Edit</a>
            |
            <form th:action="@{|/admin/${u.id}/delete|}" method="post" style="display:inline">
                <button type="submit">Delete</button>
            </form>
        </td>
    </tr>
    </tbody>
</table><br>

<table Border="1" cellpadding="10">
    <thead>
    <tr>
        <th>ID</th>
        <th>RoleName</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="r : ${role}">
        <td th:text="${r.id}"></td>
        <td th:text="${r.roleName}"></td>
        <td>
            <form th:action="@{|/admin/${r.id}/deleterole|}" method="post" style="display:inline">
                <button type="submit">Delete</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>

<form th:action="@{/logout}" th:method="POST">
    <input type="submit" value="Logout"/>
</form>

</body>
</html>
