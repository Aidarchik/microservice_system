<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit User</title>
</head>
<body>

<h1>Edit User</h1>

<form th:action="${actionUrl}" method="post" th:object="${user}">
    <label>ID:</label><br>
    <input type="text" th:value="${user.id}" disabled><br><br>

    <label>Name:</label><br>
    <input type="text" th:field="*{firstName}" required><br><br>

    <label>LastName:</label><br>
    <input type="text" th:field="*{lastName}" required><br><br>

    <label>Email:</label><br>
    <input type="email" th:field="*{email}" required><br><br>
    
    <label>Password:</label><br>
    <input type="text" th:field="*{password}" required><br><br>

     <label>Roles:</label><br>
    <div th:each="role : ${roles}">
        <input  type="checkbox"
                th:id="'role_' + ${role.id}"
                name="nameRoles"
                th:value="${role.roleName}"/>
        <label  th:for="'role_' + ${role.id}">
            <span th:text="${role.roleName}"></span>
        </label>
    </div><br><br>

    <button type="submit">Save</button>
</form>

<br>
<a th:href="${backUrl}">Back</a>

<form th:action="@{/logout}" th:method="POST">
    <input type="submit" value="Logout"/>
</form>

</body>
</html>
