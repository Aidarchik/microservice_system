<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Create User</title>
</head>
<body>

<h1>Create User</h1>

<form action="/admin" method="post" th:object="${user}">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    <label>Name:</label><br>
    <input type="text" th:field="*{firstName}" required><br><br>.

    <label>LastName:</label><br>
    <input type="text" th:field="*{lastName}" required><br><br>

    <label>Email:</label><br>
    <input type="email" th:field="*{email}" required><br><br>

    <label>Password:</label><br>
    <input type="text" th:field="*{password}" required><br><br>

    <select name="nameRoles">
        <option
                th:each="role : ${roles}"
                th:value="${role.roleName}"
                th:text="${role.getRoleName()}">
        </option>
    </select>

    <button type="submit">Create</button>
</form><br><br>



<form th:action="@{/admin/role}" th:method="POST" th:object="${role}">
    <label>RoleName:</label><br>
    <input type="text" th:field="*{roleName}" required><br><br>.

    <button type="submit">Create</button>
</form>

<br>
<a href="/admin/">Back</a>

<form th:action="@{/logout}" th:method="POST">
    <input type="submit" value="Logout"/>
</form>

</body>
</html>
